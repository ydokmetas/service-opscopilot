services:
  api:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /code/app
      - --no-proxy-headers
      - --timeout-graceful-shutdown
      - "25"
    volumes:
      - ./app:/code/app:ro
