[project]
name = "opscopilot"
version = "0.1.0"
description = "Operations management API built with FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.uv]
package = false
